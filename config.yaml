# Collation
collate:
  restart: true
  walltime: 1-00:00:00
  mem: 30GB
  ncpus: 4
  nnodes: 1
  npernode: 112
  partition: dcgp_usr_prod

#  queue: normal
  exe: /leonardo/home/userexternal/ntilinin/ACCESS-NRI/release/linux-rhel8-x86_64/intel-2021.2.0/mom5-access-om2-ogthsyx7h5fri5tww7aukcs6ifizlxwm/bin/mppnccombine.spack

# Misc
runlog: true
stacksize: unlimited
restart_freq: 5YS
mpirun: --mca io ompio --mca io_ompio_num_aggregators 1 
#mpirun: --mca btl_tcp_if_exclude virbr0,lo
#mpirun: 
mpi:
  runcmd: srun
qsub_flags: -W umask=027
env:
    UCX_LOG_LEVEL: 'error'

manifest:
  reproduce:
    exe: False

# set number of cores per node (28 for normalbw, 48 for normal on gadi), 
platform:
    nodesize: 112

# sweep and resubmit on specific errors - see https://github.com/payu-org/payu/issues/241#issuecomment-610739771
userscripts:
    error: tools/resub.sh
    run: rm -f resubmit.count
    sync: /leonardo/home/userexternal/ntilinin/om2-scripts/concatenate_ice/concat_ice_daily.sh
 