# PBS/SLURM configuration

# If submitting to a different project to your default, uncomment line below
# and replace PROJECT_CODE with appropriate code. This may require setting shortpath
# project: PROJECT_CODE

# Force payu to always find, and save, files in this scratch project directory
# shortpath: /scratch/PROJECT_CODE

scheduler: slurm
#queue: do not set for slurm
walltime: 09:00:00
jobname: 1deg_jra55_ryf
mem: 1000G
account: ICT25_MHPC 
partition: dcgp_usr_prod
#project: do not set for slurm, creates separate folder 
ncpus: 560
nnodes: 5
npernode: 112
#pmix: pmix_v3



modules:
  use:
      - /leonardo/home/userexternal/ntilinin/ACCESS-NRI/release/modules/linux-rhel8-x86_64
  load:
      - access-om2/access-om2-o33figh
      - intel-oneapi-compilers/2021.2.0-p7vtyvv
      - netcdf-c/4.7.4-d4klyvu 
      - netcdf-fortran/4.5.2-5ln2rw
      - parallelio/2.5.2-fmgl254 
      - openmpi/4.1.4-ga6avsd
      - pmix@4.2.2
# Sync options for automatically copying data from ephemeral scratch space to 
# longer term storage
sync:
    enable: False # set path below and change to true
    path: null # Set to location on /g/data or a remote server and path (rsync syntax)

